<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NowPlace</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header>
    <h1>NowPlace</h1>
</header>

<main>
    <section class="criar">
        <h2>Criar Now</h2>

        <div class="camera-box">
            <video id="camera" autoplay playsinline></video>
            <canvas id="canvas" hidden></canvas>
        </div>

        <p id="instrucao">Tire uma foto do lugar onde você está.</p>

        <div class="botoes-camera">
            <button id="btnFoto">Tirar foto</button>
            <button id="btnRecomecar">Recomeçar</button>
        </div>

        <div class="previews">
            <div>
                <p>Ambiente</p>
                <img id="fotoAmbiente" alt="Foto do ambiente">
                <span id="vazioAmbiente">Sem foto</span>
            </div>

            <div>
                <p>Selfie</p>
                <img id="fotoSelfie" alt="Selfie">
                <span id="vazioSelfie">Sem foto</span>
            </div>
        </div>

        <label for="descricao">O que você está fazendo?</label>
        <textarea id="descricao" maxlength="120" placeholder="Digite aqui..."></textarea>

        <div id="localizacao">Localização será buscada ao publicar.</div>

        <button id="btnPublicar" disabled>Publicar Now</button>
    </section>

    <section class="meu-now">
        <h2>Meus Nows</h2>

        <div id="semPost" class="sem-post">
            Você ainda não publicou nenhum Now.
        </div>

        <div id="listaPosts"></div>
    </section>
</main>

<script src="../scripts/script.js"></script>
</body>
</html>
